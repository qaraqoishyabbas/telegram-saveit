[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-saveit"
version = "0.1.0"
description = "Save Telegram media to Saved Messages"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "telethon==1.40.0",
    "python-dotenv==1.1.1",
    "qrcode==8.2",
]

[project.scripts]
saveit = "saveit.app:main"

[tool.setuptools.packages.find]
include = ["saveit*"]
